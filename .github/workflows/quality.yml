name: Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Format, lint, typecheck and test are identical across every Python CLI in
  # the family, so they are defined once in `maintenance` and called here.
  # Pinned by commit SHA, never by branch: a moving reference here is a moving
  # reference into this repository's CI. `docs/` records how to unwire it.
  #
  # The full 3-OS x 3-Python matrix is preserved — the reusable workflow takes
  # `runs-on` and `python-version` per entry precisely so this is not quietly
  # collapsed into one Ubuntu run. Building and installing the wheel stays
  # local below, as does the dependency audit.
  quality:
    name: quality (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    uses: fileworks/maintenance/.github/workflows/reusable-python-quality.yml@8bb3503084a91c8c1342c218d5562375498a30a5
    with:
      runs-on: ${{ matrix.os }}
      python-version: ${{ matrix.python }}
      sync-mode: all-groups
      # This repository audits advisories in its own job below, on one runner
      # rather than nine.
      audit: false

  build:
    name: installed wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Build source and wheel
        run: uv build
      - name: Install only the wheel and declared dependencies
        shell: bash
        run: |
          uv venv --python "${{ matrix.python }}" .artifact-venv
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv pip install --python .artifact-venv "$wheel"
      - name: Run installed-artifact deterministic E2E
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            command_path=".artifact-venv/Scripts/unpacksort.exe"
          else
            command_path=".artifact-venv/bin/unpacksort"
          fi
          python scripts/installed_e2e.py --command "$command_path"

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Install locked environment
        run: uv sync --locked --all-groups
      - name: Audit current advisories
        run: uv run pip-audit

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      # Dependency-free on purpose: a link checker that needs a marketplace
      # action is a link checker that breaks when that action moves.
      - name: docs-links
        shell: python
        run: |
          import pathlib, re, sys

          link = re.compile(r"\[[^\]]*\]\(([^)\s]+)\)")
          skip = {
              ".git", ".venv", "node_modules", "dist", "build", "target",
              "site-packages", "_internal", "resources", "vendor",
          }
          problems = []

          for markdown in pathlib.Path(".").rglob("*.md"):
              if any(part in skip for part in markdown.parts):
                  continue
              for target in link.findall(markdown.read_text(encoding="utf-8", errors="replace")):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if not (markdown.parent / target.split("#")[0]).exists():
                      problems.append(f"{markdown}: {target} does not exist")

          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)
