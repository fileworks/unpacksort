name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --locked --all-groups --python "${{ matrix.python }}"
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test generated safety corpus
        run: uv run pytest

  installed-wheel:
    name: installed wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build source and wheel
        run: uv build
      - name: Install only the wheel and declared dependencies
        shell: bash
        run: |
          uv venv --python "${{ matrix.python }}" .artifact-venv
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv pip install --python .artifact-venv "$wheel"
      - name: Run installed-artifact deterministic E2E
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            command_path=".artifact-venv/Scripts/unpacksort.exe"
          else
            command_path=".artifact-venv/bin/unpacksort"
          fi
          python scripts/installed_e2e.py --command "$command_path"

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install locked environment
        run: uv sync --locked --all-groups
      - name: Audit current advisories
        run: uv run pip-audit
