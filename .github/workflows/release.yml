name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force a release bump (patch, minor, or major)"
        required: false
        type: choice
        options: ["", patch, minor, major]
        default: ""
      recover_tag:
        description: "Rebuild and publish an existing verified tag (vX.Y.Z)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: unpacksort-release
  cancel-in-progress: false

jobs:
  release-integrity:
    name: release-integrity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.recovery.outputs.released || steps.release.outputs.released || 'false' }}
      tag: ${{ steps.recovery.outputs.tag || steps.release.outputs.tag }}
      version: ${{ steps.recovery.outputs.version || steps.release.outputs.version }}
      commit_sha: ${{ steps.recovery.outputs.commit_sha || steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.recover_tag || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Install locked release environment
        run: uv sync --locked --all-groups
      - name: Verify release baseline
        run: |
          git diff --exit-code
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest
      - name: Determine, commit, and tag the semantic version
        id: release
        if: inputs.recover_tag == ''
        # python-semantic-release v10.6.1
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e
        with:
          github_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          git_committer_name: "Niklas Büchel"
          git_committer_email: "niklas.buechel@accso.de"
          force: ${{ inputs.force }}
          vcs_release: "false"
      - name: Rebuild a verified release tag
        id: recovery
        if: inputs.recover_tag != ''
        env:
          FORCE_BUMP: ${{ inputs.force }}
          RECOVER_TAG: ${{ inputs.recover_tag }}
        shell: bash
        run: |
          if [[ -n "$FORCE_BUMP" ]]; then
            echo "::error::force and recover_tag are mutually exclusive"
            exit 1
          fi
          if [[ ! "$RECOVER_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::recover_tag must be a stable vX.Y.Z tag"
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RECOVER_TAG")" != tag ]]; then
            echo "::error::$RECOVER_TAG must be an annotated tag"
            exit 1
          fi

          commit_sha="$(git rev-parse "$RECOVER_TAG^{}")"
          if [[ "$(git rev-parse HEAD)" != "$commit_sha" ]]; then
            echo "::error::checkout does not match $RECOVER_TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "::error::$RECOVER_TAG is not reachable from protected main"
            exit 1
          fi

          version="${RECOVER_TAG#v}"
          python - "$version" <<'PY'
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          payload = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          actual = payload["project"]["version"]
          if actual != expected:
              raise SystemExit(f"tag version {expected} does not match project version {actual}")
          PY
          if [[ "$(git log -1 --format=%s)" != "chore(release): $version" ]]; then
            echo "::error::$RECOVER_TAG does not point to its release commit"
            exit 1
          fi

          uv build
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RECOVER_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
      - name: Upload immutable Python candidates
        if: steps.release.outputs.released == 'true' || steps.recovery.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  source-e2e:
    name: source distribution E2E
    needs: release-integrity
    if: needs.release-integrity.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-integrity.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Install and test the exact wheel
        shell: bash
        run: |
          uv venv --python 3.12 .release-venv
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv pip install --python .release-venv "$wheel"
          python scripts/installed_e2e.py --command .release-venv/bin/unpacksort

  windows-portable:
    name: Windows x64 portable E2E
    needs: release-integrity
    if: needs.release-integrity.outputs.released == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-integrity.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Build pinned portable executable
        env:
          PYTHONHASHSEED: "0"
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          uv sync --locked --all-groups --python 3.12
          uv run pyinstaller --clean --noconfirm unpacksort.spec
          uv run python scripts/package_portable.py `
            --executable dist/unpacksort.exe `
            --version "${{ needs.release-integrity.outputs.version }}" `
            --output release
      - name: Smoke-test the unpacked executable
        shell: pwsh
        run: |
          $archive = Get-ChildItem release/*-windows-x64.zip | Select-Object -First 1
          Expand-Archive $archive.FullName portable-smoke
          $executable = Get-ChildItem portable-smoke -Recurse -Filter unpacksort.exe |
            Select-Object -First 1
          python scripts/installed_e2e.py --command $executable.FullName
      - uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: release/*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: assemble immutable release assets
    needs: [release-integrity, source-e2e, windows-portable]
    if: needs.release-integrity.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-integrity.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: release-assets/source
      - uses: actions/download-artifact@v8
        with:
          name: windows-portable
          path: release-assets/portable
      - name: Verify types, names, version, and portable contents
        run: >-
          python scripts/release_assets.py verify
          --directory release-assets
          --version "${{ needs.release-integrity.outputs.version }}"
      - name: Create SHA-256 checksums
        run: >-
          python scripts/release_assets.py checksums
          --directory release-assets
          --output release-assets/SHA256SUMS
      - name: Upload assembled release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: publish GitHub Release
    needs: [release-integrity, prepare-release]
    if: needs.release-integrity.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-integrity.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Create GitHub release only after every artifact E2E
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-integrity.outputs.tag }}
          VERSION: ${{ needs.release-integrity.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            release-assets/source/* \
            release-assets/portable/* \
            release-assets/SHA256SUMS \
            --verify-tag \
            --title "unpacksort $VERSION" \
            --notes "Unsigned Windows executable: verify SHA256SUMS; checksums do not prove publisher identity. See CHANGELOG.md and docs/release.md."

  pypi:
    name: publish PyPI distributions
    needs: [release-integrity, github-release]
    if: needs.release-integrity.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Publish wheel and sdist through PyPI OIDC
        # pypa/gh-action-pypi-publish release/v1
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release-assets/source
          attestations: true

  winget:
    name: submit observable WinGet update
    needs: [release-integrity, github-release]
    if: needs.release-integrity.outputs.released == 'true' && vars.WINGET_SUBMISSION_ENABLED == 'true'
    runs-on: windows-latest
    environment: winget
    steps:
      - name: Download official WinGetCreate
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
      - name: Generate, validate, and submit update
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.release-integrity.outputs.version }}
          TAG: ${{ needs.release-integrity.outputs.tag }}
        shell: pwsh
        run: |
          $url = "https://github.com/fileworks/unpacksort/releases/download/$env:TAG/unpacksort-$env:VERSION-windows-x64.zip"
          .\wingetcreate.exe update fileworks.unpacksort `
            --urls "$url|x64" `
            --version "$env:VERSION" `
            --token "$env:WINGET_TOKEN" `
            --submit

  homebrew:
    name: queue guarded Homebrew update
    needs: [release-integrity, pypi]
    if: needs.release-integrity.outputs.released == 'true' && vars.HOMEBREW_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-integrity.outputs.tag }}
      - name: Dispatch to the serialized hardened tap queue
        env:
          # Reuse the existing owner-scoped release token instead of creating a
          # second long-lived cross-repository credential.
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          VERSION: ${{ needs.release-integrity.outputs.version }}
          SOURCE_RUN: ${{ github.run_id }}
          RELEASE_COMMIT: ${{ needs.release-integrity.outputs.commit_sha }}
        shell: bash
        run: |
          lock_url="https://raw.githubusercontent.com/fileworks/unpacksort/$RELEASE_COMMIT/uv.lock"
          lock_sha256="$(shasum -a 256 uv.lock | cut -d ' ' -f 1)"
          gh workflow run bump.yml \
            --repo fileworks/homebrew-tap \
            -f formula=unpacksort \
            -f version="$VERSION" \
            -f source_repository=fileworks/unpacksort \
            -f source_run="$SOURCE_RUN" \
            -f lock_url="$lock_url" \
            -f lock_sha256="$lock_sha256"
