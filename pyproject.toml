[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "unpacksort"
version = "1.0.1"
description = "Safely unpack, deduplicate, classify, and sort nested mail and archive content"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Gykonik", email = "gykonik@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Topic :: System :: Archiving",
]
dependencies = [
  "click==8.4.2",
  "pikepdf==10.11.0",
  "py7zr==1.1.3",
  "typer==0.27.1",
  "zstandard==0.25.0",
]

[project.urls]
Homepage = "https://github.com/fileworks/unpacksort"
Documentation = "https://github.com/fileworks/unpacksort/blob/main/docs/manual.md"
Issues = "https://github.com/fileworks/unpacksort/issues"
Changelog = "https://github.com/fileworks/unpacksort/blob/main/CHANGELOG.md"

[project.scripts]
unpacksort = "unpacksort.cli:app"

[dependency-groups]
dev = [
  "build==1.5.0",
  "hypothesis==6.164.0",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "PyYAML==6.0.3",
  "types-PyYAML==6.0.12.20250915",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unpacksort"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "C901",
  "COM812",
  "CPY001",
  "D203",
  "D202",
  "D213",
  "FBT001",
  "PERF401",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0917",
  "TC001",
  "TC002",
  "TC003",
  "TRY300",
  "TRY301",
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D103", "EM101", "EM102", "S603", "TRY003"]
"tests/**" = ["ANN", "D", "INP001", "PLR2004", "S101", "S106", "SLF001"]

[tool.mypy]
python_version = "3.12"
strict = true
# Same scope as immich-export and paperless-export: the tests and the release
# scripts are checked too, not just the package.
files = ["src", "tests", "scripts"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=unpacksort --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["scale: opt-in generated high-volume production-path tiers"]
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
omit = ["src/unpacksort/__main__.py"]
